<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Analyseur de Code Java</title>
    <link rel="stylesheet" href="/src/style.css">
</head>
<body>

    <header>
        <h1>Analyseur de Code Statique</h1>
    </header>

    <main>
        <section id="controls">
            <div class="analysis-option">
                <h2>Analyser un dépôt Git</h2>
                <input type="text" id="gitUrlInput" placeholder="https://github.com/user/repo.git">
                <button id="analyzeGitBtn">Lancer l'Analyse</button>
            </div>

            <div class="analysis-option">
                <h2>Analyser un projet .zip</h2>
                <input type="file" id="zipFileInput" accept=".zip">
                <button id="analyzeZipBtn">Lancer l'Analyse</button>
            </div>
        </section>

        <section id="results" class="hidden">
            <div id="loader">
                <p>Analyse en cours, veuillez patienter...</p>
            </div>

            <div id="results-content" class="hidden">
                <h2>Résultats de l'Analyse</h2>
                
                <h3>Métriques</h3>
                <table id="metricsTable">
                    <tbody id="metricsTableBody">
                        <!-- Le contenu sera généré par JavaScript -->
                    </tbody>
                </table>

                <h3>Graphe d'Appel Interactif</h3>
                
                <div id="view-selector">
                    <button class="view-btn active" data-view="force">Explorateur de Flux</button>
                    <button class="view-btn" data-view="arc">Diagramme d'Arcs</button>
                    <button class="view-btn" data-view="matrix">Matrice de Connectivité</button>
                </div>

                <div id="graph-controls">
                    <strong>Filtres :</strong>
                    <label><input type="checkbox" id="filter-call" value="CALL" checked> Appels</label>
                    <label><input type="checkbox" id="filter-instantiation" value="INSTANTIATION" checked> Instanciations</label>
                    <label><input type="checkbox" id="filter-throws" value="THROWS" checked> Exceptions</label>
                    <label class="control-separator">
                        <input type="checkbox" id="filter-internal" checked> Uniquement les appels internes
                    </label>
                </div>

                <div id="graphContainer">
                    <!-- Le graphe SVG sera injecté ici -->
                </div>
                
                <div class="graph-actions">
                    <button id="fullscreen-btn">Plein écran</button>
                    <a id="downloadBtn" href="#" download="call-graph.svg">Télécharger (SVG)</a>
                </div>
            </div>
        </section>
    </main>

    <script type="module" src="/src/main.ts"></script>
</body>
</html>
