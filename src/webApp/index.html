<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/style.css">
    <title>Analyseur de Projet Java</title>
</head>
<body>
    <div id="app">
        <header>
            <h1>Analyseur de Projet Java</h1>
            <div class="input-section">
                <input type="text" id="gitUri" placeholder="URL du repository Git" />
                <button id="analyzeBtn">Analyser</button>
            </div>
        </header>
        
        <div id="loader" class="loader hidden">
            <div class="spinner"></div>
            <p>Analyse en cours...</p>
        </div>
        
        <div id="error" class="error hidden"></div>
        
        <main id="results" class="hidden">
            <section id="metrics-section">
                <h2>Métriques</h2>
                <div id="metrics-cards"></div>
                <div id="metrics-summary"></div>
            </section>
            
            <section id="call-graph-section">
                <h2>Graphe d'Appels</h2>
                <div id="call-graph"></div>
            </section>
            
            <section id="coupling-section">
                <h2>Graphe de Couplage</h2>
                <div id="coupling-graph"></div>
            </section>
        </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
